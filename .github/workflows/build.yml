name: build-and-release

on:
  workflow_dispatch:            # 手动触发构建（不上传，仅产物可下载）
  push:
    branches: [main]            # main 提交：跑测试 + 构建校验（不上传）
    tags: ['v*']                # vX.Y.Z tag：构建并自动发布 Release assets

permissions:
  contents: write               # softprops/action-gh-release 上传 assets 需要

env:
  PYTHONUTF8: "1"               # runner 默认 cp1252，强制 UTF-8 防中文输出崩溃

jobs:
  test:
    name: 测试（内核一致性 + GUI 自检）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install --upgrade pip pywebview
      - name: 语法检查
        run: python -m py_compile dircompare.py gui/gui_webview.py gui/gui_tkinter.py web/build_web.py scripts/build_release.py
      - name: 内核一致性验收（CLI 路径 == GUI 路径，同一 compare()）
        run: python tests/test_gui_consistency.py
      - name: GUI·WebView 无窗口自检
        run: python gui/gui_webview.py --selftest
      - name: GUI·Tk 无窗口自检
        run: python gui/gui_tkinter.py --selftest

  build:
    name: 构建 Windows 产物
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装打包依赖
        run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: 提取版本号（tag v0.1.0 -> 0.1.0；手动触发用 0.0.0-ci）
        id: ver
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == v* ]]; then V="${REF#v}"; else V="0.0.0-ci"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: 构建（CLI + GUI·WebView + GUI·Tk + 网页版 + SHA256SUMS）
        run: python scripts/build_release.py --version ${{ steps.ver.outputs.version }}
      - name: 上传产物（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
